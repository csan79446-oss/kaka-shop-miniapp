<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="80" r="140" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>
  <circle cx="560" cy="280" r="130" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
  <circle cx="320" cy="180" r="180" fill="#1e3a8a" opacity="0.4"/>

  <!-- Subtle Modern Grid Lines -->
  <path d="M0 60 H640 M0 120 H640 M0 180 H640 M0 240 H640 M0 300 H640" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M80 0 V360 M160 0 V360 M240 0 V360 M320 0 V360 M400 0 V360 M480 0 V360 M560 0 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Main Hero Card Glass Container -->
  <rect x="50" y="40" width="540" height="280" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Top Pill: Official Telegram MiniApp -->
  <rect x="220" y="58" width="200" height="30" rx="15" fill="rgba(36, 129, 204, 0.35)" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="236" cy="73" r="5" fill="#10b981"/>
  <text x="250" y="78" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">TELEGRAM MINIAPP</text>

  <!-- Big Brand Title: PHSAR24 -->
  <text x="320" y="145" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="2">PHSAR24</text>
  
  <!-- Subtitle Tagline -->
  <text x="320" y="180" text-anchor="middle" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="0.5">ផ្សារអនឡាញ ២៤ ម៉ោង • ទំនើប និងរហ័សទាន់ចិត្ត</text>

  <!-- 3 Feature Chips -->
  <!-- Chip 1: Multi-Vendor -->
  <rect x="100" y="215" width="130" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="165" y="237" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">🏪 Multi-Vendor</text>

  <!-- Chip 2: Bakong KHQR -->
  <rect x="255" y="215" width="130" height="34" rx="17" fill="rgba(225, 29, 72, 0.2)" stroke="#f43f5e" stroke-width="1"/>
  <text x="320" y="237" text-anchor="middle" fill="#ffe4e6" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">🇰🇭 Bakong KHQR</text>

  <!-- Chip 3: Fast Delivery -->
  <rect x="410" y="215" width="130" height="34" rx="17" fill="rgba(16, 185, 129, 0.2)" stroke="#34d399" stroke-width="1"/>
  <text x="475" y="237" text-anchor="middle" fill="#d1fae5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">🛵 24/7 Delivery</text>

  <!-- Bottom CTA Button -->
  <rect x="230" y="265" width="180" height="36" rx="18" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <text x="320" y="288" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">START SHOPPING</text>

  <!-- Corner Decorative Stars -->
  <polygon points="75,65 78,72 85,73 80,78 81,85 75,81 69,85 70,78 65,73 72,72" fill="#fbbf24"/>
  <polygon points="565,295 567,300 572,301 568,305 569,310 565,307 561,310 562,305 558,301 563,300" fill="#38bdf8"/>
</svg>
